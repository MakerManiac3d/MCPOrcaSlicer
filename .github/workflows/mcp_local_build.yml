# Compilación de la rama MCP en el ejecutor propio (el PC "DISEÑO"), con las dependencias y la
# compilación en rutas cortas y persistentes (C:\ob) para que las recompilaciones sean incrementales.
name: MCP local build

# En un fork solo se pueden lanzar a mano los flujos de la rama principal, así que este se lanza al
# subir cambios a mcp-api y lee qué hacer de .github/mcp-build-mode (diag, deps, slicer, all o none;
# añadir "clean" en una segunda línea borra antes la compilación del modo elegido).
on:
  push:
    branches: [mcp-api]
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag | deps | slicer | all'
        default: 'diag'
        type: string
      clean:
        description: 'Borrar la compilación previa del modo elegido'
        default: false
        type: boolean

concurrency:
  group: mcp-local-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 600
    env:
      DEPS_DIR: C:\ob\deps
      BUILD_DIR: C:\ob\build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false
          clean: false

      - name: Modo
        id: mode
        shell: powershell
        run: |
          $mode = "${{ inputs.mode }}"; $clean = "${{ inputs.clean }}" -eq "true"
          if (-not $mode -and (Test-Path .github/mcp-build-mode)) {
            $lines = @(Get-Content .github/mcp-build-mode | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            $mode = $lines[0]; $clean = $lines -contains "clean"
          }
          if (-not $mode) { $mode = "diag" }
          "Modo: $mode, limpiar: $clean"
          $c = if ($clean) { '-c' } else { '' }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "mode=$mode`nclean=$c`n")

      - name: Diagnóstico del entorno
        shell: powershell
        run: |
          "Procesadores lógicos: $env:NUMBER_OF_PROCESSORS"
          Get-CimInstance Win32_Processor | Select-Object -First 1 Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          "RAM (GB): " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)
          Get-PSDrive C | Select-Object Used, Free | Format-List
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -products * -format text | Select-String "installationPath|displayName|installationVersion" }
          foreach ($t in "cmake","perl","git","ninja","winget","python") {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            "{0,-7} {1}" -f $t, ($(if ($c) { $c.Source } else { "NO ENCONTRADO" }))
          }
          if (Test-Path "C:\Strawberry\perl\bin\perl.exe") { "Strawberry Perl: C:\Strawberry" } else { "Strawberry Perl: no instalado" }
          whoami
          "--- Variables de entorno que pueden interferir (OpenRevers, CMake, Qt, OCCT):"
          Get-ChildItem env: | Where-Object { $_.Name -match 'CMAKE|OCC|CASCADE|QT|VCPKG|BOOST|TBB|EIGEN|_DIR$|_ROOT$' -or $_.Value -match 'orv-deps' } | ForEach-Object { "{0} = {1}" -f $_.Name, $_.Value }
          "--- Registro de paquetes de CMake del usuario:"
          if (Test-Path HKCU:\Software\Kitware\CMake\Packages) { Get-ChildItem HKCU:\Software\Kitware\CMake\Packages | ForEach-Object { $_.PSChildName } }

      - name: Perl portable (lo necesita OpenSSL)
        if: ${{ steps.mode.outputs.mode == 'deps' || steps.mode.outputs.mode == 'all' }}
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          if (-not (Test-Path C:\ob\perl\perl\bin\perl.exe)) {
            New-Item -ItemType Directory -Force C:\ob | Out-Null
            $rel = Invoke-RestMethod https://api.github.com/repos/StrawberryPerl/Perl-Dist-Strawberry/releases/latest
            $asset = $rel.assets | Where-Object { $_.name -like '*64bit-portable.zip' } | Select-Object -First 1
            "Descargando $($asset.name)"
            Invoke-WebRequest $asset.browser_download_url -OutFile C:\ob\perl.zip
            Expand-Archive C:\ob\perl.zip C:\ob\perl -Force
            Remove-Item C:\ob\perl.zip
          }
          & C:\ob\perl\perl\bin\perl.exe -v | Select-String "This is perl"

      - name: Dependencias (deps)
        if: ${{ steps.mode.outputs.mode == 'deps' || steps.mode.outputs.mode == 'all' }}
        shell: cmd
        run: |
          set "PATH=C:\ob\perl\perl\bin;%PATH%"
          REM Las dependencias se compilan fuera del repositorio (rutas cortas). Orca entonces calcula los
          REM parches de "git apply --directory" con una ruta que sale del repo y git la rechaza; con el techo
          REM de git en el espacio de trabajo no detecta el repositorio y aplica los parches como archivos sueltos.
          set "GIT_CEILING_DIRECTORIES=%GITHUB_WORKSPACE%"
          REM El registro de paquetes de CMake del usuario apunta a otras instalaciones (OpenRevers): se ignora.
          call build_win.bat -d --deps-dir %DEPS_DIR% --deps-args "-DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF" ${{ steps.mode.outputs.clean }}

      - name: OrcaSlicer
        if: ${{ steps.mode.outputs.mode == 'slicer' || steps.mode.outputs.mode == 'all' }}
        shell: cmd
        run: |
          if exist %BUILD_DIR%\CMakeCache.txt findstr /c:"orv-deps" %BUILD_DIR%\CMakeCache.txt >nul && del %BUILD_DIR%\CMakeCache.txt
          call build_win.bat -s -i --no-gettext --deps-dir %DEPS_DIR% --build-dir %BUILD_DIR% --slicer-args "-DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF" ${{ steps.mode.outputs.clean }}

      - name: Ubicación del programa
        if: ${{ steps.mode.outputs.mode == 'slicer' || steps.mode.outputs.mode == 'all' }}
        shell: powershell
        run: |
          Get-ChildItem C:\ob\build -Recurse -Filter orca-slicer.exe -ErrorAction SilentlyContinue | Select-Object FullName, Length, LastWriteTime | Format-List
